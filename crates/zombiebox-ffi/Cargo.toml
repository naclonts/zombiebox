[package]
name = "zombiebox-ffi"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[lib]
crate-type = ["staticlib", "cdylib"]

[dependencies]
zombiebox-core = { path = "../zombiebox-core" }

[target.'cfg(target_os = "android")'.dependencies]
zombiebox-render3d = { path = "../zombiebox-render3d", features = ["gpu"] }
raw-window-handle = "0.6.2"
wgpu = "30.0.1"
pollster = "0.4.0"
