[package]
name = "zombiebox-render3d"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[features]
default = []
gpu = ["dep:wgpu", "dep:pollster", "dep:png"]
viewer = ["gpu", "dep:winit"]

[dependencies]
zombiebox-core = { path = "../zombiebox-core" }
glam = { version = "0.27.0", features = ["bytemuck"] }
bytemuck = { version = "1.25.2", features = ["derive"] }
wgpu = { version = "30.0.1", optional = true }
pollster = { version = "0.4.0", optional = true }
png = { version = "0.18.1", optional = true }
winit = { version = "0.30.13", optional = true, default-features = false, features = [
    "rwh_06",
    "x11",
    "wayland",
    "wayland-dlopen",
    "wayland-csd-adwaita-crossfont",
] }

[[example]]
name = "smoke"
path = "examples/smoke.rs"
required-features = ["gpu"]

[[example]]
name = "preview3d"
path = "examples/preview3d.rs"
required-features = ["gpu"]
